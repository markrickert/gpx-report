services:
  db:
    image: postgis/postgis:15-3.4
    container_name: gpx-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpxuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpxpassword}
      POSTGRES_DB: ${POSTGRES_DB:-gpxreport}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpxuser} -d ${POSTGRES_DB:-gpxreport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gpx-report-backend
    restart: unless-stopped
    mem_limit: 2g
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpxuser}:${POSTGRES_PASSWORD:-gpxpassword}@db:5432/${POSTGRES_DB:-gpxreport}
      GRAPHQL_PORT: 4000
      GPX_FILES_DIRECTORY: /gpx-files
    ports:
      - "4000:4000"
    volumes:
      - ./data/gpx:/gpx-files

  frontend:
    build: ./frontend
    container_name: gpx-report-frontend
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
