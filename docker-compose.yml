services:
  db:
    image: postgis/postgis:15-3.4
    container_name: gpx-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpxuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpxpassword}
      POSTGRES_DB: ${POSTGRES_DB:-gpxreport}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpxuser} -d ${POSTGRES_DB:-gpxreport}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: gpx-report-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpxuser}:${POSTGRES_PASSWORD:-gpxpassword}@db:5432/${POSTGRES_DB:-gpxreport}
      GRAPHQL_PORT: 4000
      GPX_FILES_DIRECTORY: /gpx-files
    ports:
      - "4000:4000"
    volumes:
      - ./data/gpx:/gpx-files
      # Shared with code-server's home volume so setCodeServerTheme can write
      # its settings.json (theme toggle sync, see resolvers.js).
      - code_server_data:/code-server-home

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_URL: https://gpx-report-api.example.com/graphql
        VITE_CODE_SERVER_URL: https://gpx-report-code.example.com
    container_name: gpx-report-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  syncthing:
    image: syncthing/syncthing:latest
    container_name: gpx-report-syncthing
    restart: unless-stopped
    hostname: gpx-report-server
    environment:
      # The official image chown's $HOME non-recursively on boot, which never
      # reaches /var/syncthing/config since it's a separate mounted volume
      # (owned by root by default) — running as root avoids that mismatch.
      PUID: ${SYNCTHING_PUID:-0}
      PGID: ${SYNCTHING_PGID:-0}
    volumes:
      - syncthing_config:/var/syncthing/config
      - ./data/gpx:/var/syncthing/gpx
    ports:
      - "8384:8384" # Web GUI
      - "22000:22000/tcp" # Sync protocol
      - "22000:22000/udp"
      - "21027:21027/udp" # Local discovery

  code-server:
    image: codercom/code-server:latest
    container_name: gpx-report-code-server
    restart: unless-stopped
    user: "0:0" # repo bind mount is root-owned on the host; run as root so the
    # editor (uid 1000 "coder" by default) can actually write/delete files.
    # No built-in auth (--auth none): this container has full read/write
    # access to the repo (and a shell) via the browser. Reachable via a
    # Caddy site (gpx-report-code.example.com), same Tailscale-only
    # trust boundary as the Syncthing GUI / GraphQL API sites. See
    # docs/SETUP.md.
    command: --auth none --bind-addr 0.0.0.0:8080 /opt/gpx-report
    volumes:
      - ./:/opt/gpx-report
      # user: "0:0" means $HOME is /root, not the image's default
      # /home/coder — mount here or code-server's user settings (extensions,
      # workbench.colorTheme, ...) never actually persist across recreates.
      - code_server_data:/root/.local
    ports:
      - "8443:8080"

volumes:
  db_data:
  syncthing_config:
  code_server_data:
