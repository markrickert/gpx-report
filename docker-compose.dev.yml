# Dev-mode override — NOT applied by a plain `docker compose up`. Only takes
# effect when explicitly layered on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build backend frontend
#
# Swaps `backend`/`frontend` from their production build (compiled output,
# no source bind mount — see "Getting code changes live" in CLAUDE.md) to a
# hot-reload dev setup: source is bind-mounted in, and each runs its dev
# server (`tsx watch`, Expo's Metro web dev server) instead of the production
# command, so edits under backend/src or frontend/src take effect without a
# rebuild. `db` is untouched — dev containers talk
# to the same live Postgres.
#
# The frontend dev server has no Caddy proxy, so it reads EXPO_PUBLIC_GRAPHQL_URL
# from the container env when Metro bundles — see `.env`. The production image
# calls /graphql on its own origin instead.
#
# To go back to production, rebuild without this override file:
#   docker compose up -d --build backend frontend
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: pnpm run dev
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: pnpm exec expo start --web --port 3000
    environment:
      EXPO_PUBLIC_GRAPHQL_URL: ${EXPO_PUBLIC_GRAPHQL_URL}
    volumes:
      - ./frontend/src:/app/src
