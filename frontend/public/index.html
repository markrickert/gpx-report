<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>GPX Report</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Unlike react-native-web's default reset, the page itself scrolls (not a
      full-height <ScrollView>): the web screens are plain DOM pages styled by
      src/web.css, same as the pre-Expo Vite app.
    -->
    <style id="expo-reset">
      #root {
        display: flex;
        min-height: 100%;
        flex-direction: column;
      }
    </style>
    <script>
      (function () {
        var stored = localStorage.getItem("gpx-report-theme");
        var theme =
          stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
